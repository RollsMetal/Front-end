<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA RollsMetal</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ../targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="alvo" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<script>
// Alvo (foto da mesa): 5712 x 4284 px -> largura 1, altura 0.75.
// Origem no centro da foto: x vai de -0.5 (esquerda) a 0.5 (direita), y vai de 0.375 (topo) a -0.375 (base).
// (x, y) = onde o sensor está na foto | (cx, cy) = centro do cartão de texto
var SENSORES = [
  { id: 'nivel',      nome: 'Sensor de nível',   desc: 'IO-Link · reservatório', x: -0.335, y: 0.13,  cx: -0.335, cy: 0.29 },
  { id: 'indutivo',   nome: 'Sensor indutivo',   desc: 'Detecta peças metálicas',     x: 0.411,  y: 0.046, cx: 0.0,    cy: 0.29 },
  { id: 'capacitivo', nome: 'Sensor capacitivo', desc: 'Detecta peças não metálicas', x: 0.394,  y: 0.157, cx: 0.335,  cy: 0.29 }
];
var LARG = 0.31, ALT = 0.15, COR = '#fb923c';
var API = new URLSearchParams(location.search).get('api') || 'https://rollmetal-backend.onrender.com';
var SERIAL = new URLSearchParams(location.search).get('serial') || '';
var alvo = document.getElementById('alvo');

// Cartão desenhado em canvas: não depende de fonte externa e aceita acentos.
AFRAME.registerComponent('cartao', {
  schema: { nome: { default: '' }, desc: { default: '' }, valor: { default: '--' }, alerta: { default: false }, barra: { default: false } },
  init: function () {
    this.canvas = document.createElement('canvas');
    this.canvas.width = 620;
    this.canvas.height = 300;
    this.tex = new AFRAME.THREE.CanvasTexture(this.canvas);
    this.tex.colorSpace = AFRAME.THREE.SRGBColorSpace;
  },
  update: function () {
    var d = this.data, c = this.canvas, g = c.getContext('2d');
    if (d.barra) {
      c.width = 1000;
      c.height = 120;
      g.fillStyle = d.alerta ? '#b91c1c' : '#14181f';
      g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = '#ffffff';
      g.font = 'bold 54px Arial, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(d.nome, c.width / 2, c.height / 2);
      this.tex.needsUpdate = true;
      var m = this.el.getObject3D('mesh');
      if (m && m.material.map !== this.tex) { m.material.map = this.tex; m.material.needsUpdate = true; }
      return;
    }
    g.clearRect(0, 0, c.width, c.height);
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = d.alerta ? '#b91c1c' : '#fb923c';
    g.fillRect(0, 0, 18, c.height);
    g.textBaseline = 'middle';
    g.fillStyle = '#14181f';
    g.font = 'bold 50px Arial, sans-serif';
    g.fillText(d.nome, 40, 58);
    g.fillStyle = '#4b5563';
    g.font = '36px Arial, sans-serif';
    g.fillText(d.desc, 40, 146);
    g.fillStyle = d.alerta ? '#b91c1c' : '#c2410c';
    g.font = 'bold 58px Arial, sans-serif';
    g.fillText(d.valor, 40, 236);
    this.tex.needsUpdate = true;
    var mesh = this.el.getObject3D('mesh');
    if (mesh && mesh.material.map !== this.tex) {
      mesh.material.map = this.tex;
      mesh.material.needsUpdate = true;
    }
  }
});

function linha(x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var tam = Math.sqrt(dx * dx + dy * dy);
  var ang = Math.atan2(dy, dx) * 180 / Math.PI;
  return '<a-plane shader="flat" color="' + COR + '" position="' + (x1 + x2) / 2 + ' ' + (y1 + y2) / 2 + ' 0.015" rotation="0 0 ' + ang + '" width="' + tam + '" height="0.006"></a-plane>';
}

SENSORES.forEach(function (s) {
  var g = document.createElement('a-entity');
  g.innerHTML =
    linha(s.x, s.y, s.cx, s.cy - ALT / 2) +
    (s.id === 'nivel'
      ? '<a-ring shader="flat" color="' + COR + '" position="' + s.x + ' ' + s.y + ' 0.016" radius-inner="0.02" radius-outer="0.03"></a-ring>'
      : '<a-circle shader="flat" color="#ffffff" position="' + s.x + ' ' + s.y + ' 0.016" radius="0.03"></a-circle>' +
        '<a-circle shader="flat" color="' + COR + '" position="' + s.x + ' ' + s.y + ' 0.017" radius="0.022"></a-circle>') +
    '<a-plane id="c-' + s.id + '" shader="flat" transparent="true" position="' + s.cx + ' ' + s.cy + ' 0.02" width="' + LARG + '" height="' + ALT + '" cartao="nome: ' + s.nome + '; desc: ' + s.desc + '; valor: --"></a-plane>';
  alvo.appendChild(g);
});

var rodape = document.createElement('a-entity');
rodape.innerHTML = '<a-plane id="c-status" shader="flat" transparent="true" position="0 -0.335 0.02" width="0.5" height="0.06" cartao="nome: Aguardando dados da API; barra: true"></a-plane>';
alvo.appendChild(rodape);

function cartao(id, nome, desc, valor, alerta) {
  var el = document.getElementById(id);
  if (el) el.setAttribute('cartao', { nome: nome, desc: desc, valor: valor, alerta: !!alerta, barra: id === 'c-status' });
}

function quartil(v, q) {
  var o = v.slice().sort(function (a, b) { return a - b; });
  var p = (o.length - 1) * q, b = Math.floor(p), r = p - b;
  return o[b + 1] !== undefined ? o[b] + r * (o[b + 1] - o[b]) : o[b];
}

function atualizar() {
  if (!SERIAL) {
    fetch(API + '/api/esteiras').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (esteiras) {
      if (!esteiras.length) throw new Error();
      SERIAL = esteiras[0].numeroSerial;
      atualizar();
    }).catch(function () { cartao('c-status', 'Cadastre ou selecione uma esteira', '', '', true); });
    return;
  }
  var caminho = '/api/esteiras/' + encodeURIComponent(SERIAL);
  Promise.all([
    fetch(API + caminho + '/sensores').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }),
    fetch(API + caminho + '/leituras?' + new URLSearchParams({ pagina: '0', tamanho: '100' })).then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  ]).then(function (respostas) {
    var sensores = respostas[0], pagina = respostas[1], dados = pagina.content || [];
    var contagem = { METAL: 0, PLASTICO: 0, SEM_MATERIAL: 0, DESCONHECIDO: 0 };
    dados.forEach(function (l) { contagem[l.tipoMaterial] = (contagem[l.tipoMaterial] || 0) + 1; });
    var rotulos = ['c-nivel', 'c-indutivo', 'c-capacitivo'];
    rotulos.forEach(function (id, i) {
      var s = sensores[i];
      cartao(id, s ? 'Porta ' + s.porta + ' · ' + s.tipoSensor : 'Sensor não cadastrado', s ? 'Modelo ' + s.modelo : 'Sem dados de sensor', s ? 'Sensor #' + s.id : '--', false);
    });
    cartao('c-status', SERIAL + ' · ' + pagina.totalElements + ' leituras · ' + new Date().toLocaleTimeString('pt-BR'),
      'Página atual: ' + dados.length + ' · Metal: ' + contagem.METAL + ' · Plástico: ' + contagem.PLASTICO, '', false);
  }).catch(function () { cartao('c-status', 'Sem conexão com a API', '', '', true); });
}
// espera a cena carregar para criar os cartões antes da primeira atualização
document.querySelector('a-scene').addEventListener('loaded', function () {
  atualizar();
  setInterval(atualizar, 3000);
});
</script>
</body>
</html>
