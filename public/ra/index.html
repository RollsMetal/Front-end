<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA RollsMetal</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ../targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="alvo" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<script>
// Alvo: 5712 x 4284 px -> largura 1, altura 0.75. Origem no centro da imagem (x: -0.5 a 0.5, y: -0.375 a 0.375)
// AJUSTE AQUI: (x, y) = onde o sensor está na foto | (lx, ly) = onde fica o cartão de texto
var SENSORES = [
  { nome: 'Sensor indutivo',   desc: 'Detecta pecas metalicas',     x: -0.25, y: 0.05, lx: -0.3, ly: 0.28 },
  { nome: 'Sensor capacitivo', desc: 'Detecta pecas nao metalicas', x:  0.25, y: 0.05, lx:  0.3, ly: 0.28 }
];
var API = new URLSearchParams(location.search).get('api') || 'http://localhost:8080';
var alvo = document.getElementById('alvo');

SENSORES.forEach(function (s) {
  var g = document.createElement('a-entity');
  g.innerHTML =
    '<a-circle position="' + s.x + ' ' + s.y + ' 0.01" radius="0.025" color="#fb923c"></a-circle>' +
    '<a-entity line="start: ' + s.x + ' ' + s.y + ' 0.01; end: ' + s.lx + ' ' + (s.ly - 0.06) + ' 0.01; color: #fb923c"></a-entity>' +
    '<a-plane position="' + s.lx + ' ' + s.ly + ' 0.02" width="0.42" height="0.12" color="#ffffff"></a-plane>' +
    '<a-text value="' + s.nome + '" position="' + (s.lx - 0.19) + ' ' + (s.ly + 0.025) + ' 0.03" width="0.8" color="#14181f" align="left"></a-text>' +
    '<a-text value="' + s.desc + '" position="' + (s.lx - 0.19) + ' ' + (s.ly - 0.025) + ' 0.03" width="0.6" color="#374151" align="left"></a-text>';
  alvo.appendChild(g);
});

var painel = document.createElement('a-entity');
painel.innerHTML =
  '<a-plane position="0 -0.27 0.02" width="0.9" height="0.16" color="#14181f" opacity="0.85"></a-plane>' +
  '<a-text id="txt" value="Aguardando dados da API" position="0 -0.27 0.03" width="1.2" color="#ffffff" align="center"></a-text>';
alvo.appendChild(painel);

function quartil(v, q) {
  var o = v.slice().sort(function (a, b) { return a - b; });
  var p = (o.length - 1) * q, b = Math.floor(p), r = p - b;
  return o[b + 1] !== undefined ? o[b] + r * (o[b + 1] - o[b]) : o[b];
}

function atualizar() {
  fetch(API + '/leituras').then(function (r) { return r.json(); }).then(function (dados) {
    var met = 0, niveis = [], ultimo = null, ultimoT = 0;
    dados.forEach(function (l) {
      var t = String(l.tipo || l.tipoPeca || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (t.indexOf('METAL') >= 0 && t.indexOf('NAO') < 0) met++;
      var n = Number(l.nivelReservatorio != null ? l.nivelReservatorio : l.nivel);
      var h = new Date(l.horario || l.dataHora || l.timestamp).getTime() || 0;
      if (!isNaN(n)) { niveis.push(n); if (h >= ultimoT) { ultimoT = h; ultimo = n; } }
    });
    var lim = niveis.length >= 4 ? quartil(niveis, 0.75) + 1.5 * (quartil(niveis, 0.75) - quartil(niveis, 0.25)) : null;
    var alerta = lim !== null && ultimo !== null && ultimo > lim;
    var txt = document.getElementById('txt');
    txt.setAttribute('value', 'Metalicas: ' + met + '  |  Nao metalicas: ' + (dados.length - met) + '\nNivel: ' + (ultimo === null ? '--' : ultimo.toFixed(1)) + '%' + (alerta ? '  ALERTA' : ''));
    txt.setAttribute('color', alerta ? '#fca5a5' : '#ffffff');
  }).catch(function () {});
}
atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
